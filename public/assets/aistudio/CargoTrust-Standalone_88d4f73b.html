function bindPageEvents(){ $$('#page-container [data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$$('#page-container [data-action]').forEach(b=>b.addEventListener('click',()=>handleAction(b.dataset.action)));$$('#page-container [data-open-doc]').forEach(b=>b.addEventListener('click',()=>openDocument(b.dataset.openDoc)));$$('#page-container [data-approve]').forEach(b=>b.addEventListener('click',()=>openApproval(b.dataset.approve)));$('#doc-search')?.addEventListener('input',e=>{state.search=e.target.value;const pos=e.target.selectionStart;render();const el=$('#doc-search');el.focus();el.setSelectionRange(pos,pos)});$('#status-filter')?.addEventListener('change',e=>{state.filter=e.target.value;render()});$('#page-container [data-policy-toggle]')&&$$('#page-container [data-policy-toggle]').forEach(b=>b.addEventListener('click',()=>{const p=state.policies[Number(b.dataset.policyToggle)];p.enabled=!p.enabled;render();toast('Policy updated',`${p.title} is ${p.enabled?'enabled':'disabled'} in the prototype.`)}));$('#audit-search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('#audit-rows').innerHTML=state.audit.filter(a=>`${a.time} ${a.actor} ${a.event} ${a.detail}`.toLowerCase().includes(q)).map(auditRow).join('')||'<tr><td colspan="4"><div class="empty-state"><strong>No matching events</strong></div></td></tr>'});}

function openDocument(id){const d=state.docs.find(x=>x.id===id);if(!d)return;state.activeDoc=id;const mismatch=d.id==='DOC-2408';const backdrop=document.createElement('div');backdrop.className='drawer-backdrop';backdrop.id='doc-drawer';backdrop.innerHTML=`<aside class="drawer"><div class="drawer-header"><div><h2>Document details</h2><p>${esc(d.id)} · Current workspace record</p></div><button class="close-button" data-close-drawer aria-label="Close">×</button></div><div class="drawer-body"><div class="detail-title">${fileIcon(d.ext)}<div><h3>${esc(d.name)}</h3><p>${esc(d.type)} · Uploaded by ${esc(d.owner)}</p><div style="margin-top:8px">${statusBadge(d.status,d.statusKey)}</div></div></div><div class="detail-grid"><div class="detail-field"><span>COUNTERPARTY</span><strong>${esc(d.counterparty)}</strong></div><div class="detail-field"><span>REFERENCE</span><strong>${esc(d.ref)}</strong></div><div class="detail-field"><span>DOCUMENT VALUE</span><strong>${esc(d.amount)}</strong></div><div class="detail-field"><span>LAST UPDATED</span><strong>${esc(d.date)}</strong></div><div class="detail-field"><span>DOCUMENT VERSION</span><strong>v${d.statusKey==='signed'?'3':'2'}.0</strong></div><div class="detail-field"><span>FILE FINGERPRINT</span><strong>${esc(d.hash)}</strong></div></div><div class="detail-section"><h4>AI review & field matching</h4><div class="notice ${mismatch?'red':''}"><strong>${mismatch?'!':'✓'}</strong><div>${esc(d.description)} ${mismatch?'This document is blocked from signing until the exception is resolved and approved.':'Review the extracted fields before approving a sensitive action.'}</div></div><div style="margin-top:10px"><div class="match-row"><span>Purchase order</span><strong>${esc(d.po)}</strong></div><div class="match-row"><span>Invoice quantity</span><strong class="${mismatch?'match-bad':'match-good'}">${d.quantity} units ${mismatch?'· mismatch':'· extracted'}</strong></div><div class="match-row"><span>Unit price</span><strong>${d.unitPrice?`${d.currency} ${d.unitPrice.toFixed(2)}`:'Not applicable'}</strong></div><div class="match-row"><span>AI confidence</span><strong>${mismatch?'98.2% · exception detected':'97.8% · fields extracted'}</strong></div></div></div><div class="detail-section"><h4>Activity timeline</h4><div class="timeline">${d.events.map(e=>`<div class="timeline-item"><div class="timeline-mark ${e[2]==='pending'?'pending':''}">${e[2]==='pending'?'!':'✓'}</div><div class="timeline-copy"><strong>${esc(e[0])}</strong><p>${esc(e[1])}</p></div></div>`).join('')}</div></div><div class="detail-section"><h4>Protected action</h4><p style="font-size:10px;color:#8392a4;line-height:1.6">The signing button below simulates the workflow gate. It does not create a real Tide signature in this prototype.</p></div></div><div class="drawer-footer"><button class="btn" data-close-drawer>Close</button><button class="btn" data-action="run-ai-drawer">↻ Re-run comparison</button><button class="btn btn-primary" data-action="sign-drawer" ${mismatch?'disabled':''}>${d.statusKey==='signed'?'✓ Signed':'Request protected signing'}</button></div></aside>`;document.body.append(backdrop);backdrop.addEventListener('click',e=>{if(e.target===backdrop||e.target.closest('[data-close-drawer]'))backdrop.remove();});$('[data-action="run-ai-drawer"]',backdrop).addEventListener('click',()=>{backdrop.remove();runAIReview(d.id)});$('[data-action="sign-drawer"]',backdrop).addEventListener('click',()=>{if(mismatch){toast('Signing blocked','Resolve the invoice quantity mismatch first.','error');return}backdrop.remove();requestProtectedSigning(d.id)});}
function openApproval(id){const a=state.approvals.find(x=>x.id===id);if(!a)return;const d=state.docs.find(x=>x.id===a.docId);const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML=`<section class="modal"><div class="modal-header"><div><h2>Review approval request</h2><p>${esc(a.id)} · ${esc(a.kind)}</p></div><button class="close-button" data-close>×</button></div><div class="modal-body"><div class="detail-title">${fileIcon('PDF')}<div><h3>${esc(a.title)}</h3><p>${esc(a.counterparty)} · ${esc(a.amount)}</p></div></div><div class="notice ${a.docId==='DOC-2408'?'red':''}"><strong>${a.docId==='DOC-2408'?'!':'i'}</strong><div>${esc(a.reason)}</div></div><div class="detail-section"><h4>Approval progress</h4><div class="match-row"><span>Approvals recorded</span><strong>${a.received} / ${a.required}</strong></div><div class="match-row"><span>Requester</span><strong>${esc(a.requester)}</strong></div><div class="match-row"><span>Separation of duties</span><strong class="match-good">Required</strong></div></div><div class="form-field"><label for="approval-note">Review note (optional)</label><textarea id="approval-note" placeholder="Add context for the audit trail…"></textarea></div><div class="notice"><strong>!</strong><div>Prototype action only. Approval is recorded in local demo state and is not a cryptographically enforced Tide approval.</div></div></div><div class="modal-footer"><button class="btn" data-close>Cancel</button><button class="btn btn-danger" data-decline="${esc(id)}">Request changes</button><button class="btn btn-primary" data-confirm-approve="${esc(id)}">Record approval</button></div></section>`;$('#modal-root').append(modal);modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))modal.remove()});$('[data-confirm-approve]',modal).addEventListener('click',()=>{if(a.docId==='DOC-2408'){toast('Exception requires review','Resolve the PO / invoice quantity mismatch before approval.','error');return}if(state.role==='Requester'||state.role==='AI Agent'){toast('Approval denied','Your current demo role cannot approve this request.','error');return}a.received=Math.min(a.required,a.received+1);if(a.received>=a.required){const doc=state.docs.find(x=>x.id===a.docId);if(doc){doc.status='Approved';doc.statusKey='approved'}state.approvals=state.approvals.filter(x=>x.id!==id);state.audit.unshift({time:new Date().toLocaleString('en-GB'),actor:state.role,event:'Approval threshold reached',detail:`${a.title} · ${a.required} of ${a.required} required approvals recorded in demo state.`,result:'Success',tone:'green'});toast('Approval recorded','Required approval threshold reached in the prototype.')}else{toast('Approval recorded',`${a.received} of ${a.required} approvals recorded.`)}modal.remove();render()});$('[data-decline]',modal).addEventListener('click',()=>{state.approvals=state.approvals.filter(x=>x.id!==id);if(d){d.status='Needs changes';d.statusKey='action'}state.audit.unshift({time:new Date().toLocaleString('en-GB'),actor:state.role,event:'Changes requested',detail:`${a.title} · ${$('#approval-note',modal).value||'No note supplied'}`,result:'Exception flagged',tone:'red'});modal.remove();render();toast('Changes requested','The request has been returned for correction.','error')});}
function openUpload(){const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML=`<section class="modal"><div class="modal-header"><div><h2>Upload a trade document</h2><p>Add a PO, invoice or contract to the document register.</p></div><button class="close-button" data-close>×</button></div><form id="upload-form"><div class="modal-body"><label class="upload-drop" for="file-upload"><div class="upload-symbol">↑</div><strong id="upload-file-label">Choose a file or drag it here</strong><p>PDF, PNG or JPG · Prototype uses sample extraction</p><input id="file-upload" type="file" accept=".pdf,.png,.jpg,.jpeg" /></label><div class="form-field" style="margin-top:17px"><label for="doc-type">Document type</label><select id="doc-type"><option>Commercial Invoice</option><option>Purchase Order</option><option>Sales Contract</option><option>Packing List</option><option>Bill of Lading</option><option>Certificate of Origin</option></select></div><div class="form-field"><label for="counterparty">Counterparty</label><select id="counterparty">${state.counterparties.filter(c=>c.type!=='Workspace owner').map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="form-field"><label for="doc-ref">Reference number</label><input id="doc-ref" placeholder="e.g. INV-2409" required /></div><div class="notice"><strong>i</strong><div>AI extraction is simulated in this prototype. No document is sent to an external AI service.</div></div></div><div class="modal-footer"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn btn-primary">Upload & extract fields →</button></div></form></section>`;$('#modal-root').append(modal);modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))modal.remove()});$('#file-upload',modal).addEventListener('change',e=>{$('#upload-file-label',modal).textContent=e.target.files[0]?.name||'Choose a file or drag it here'});$('#upload-form',modal).addEventListener('submit',e=>{e.preventDefault();const type=$('#doc-type',modal).value;const ref=$('#doc-ref',modal).value.trim();const cp=$('#counterparty',modal).value;const file=$('#file-upload',modal).files[0];const id='DOC-'+(2409+state.docs.length-8);const ext=file?.name.toLowerCase().endsWith('.pdf')?'PDF':'DOC';const d={id,name:file?.name||`${type.replaceAll(' ','_')}_${ref}.pdf`,type,ext,ref,counterparty:cp,date:'22 Oct 2026',amount:'—',status:'Processing',statusKey:'processing',owner:'Minh Le',po:'Not linked',quantity:0,unitPrice:0,currency:'USD',hash:'pending extraction',description:'Sample AI extraction completed. Review extracted fields and link a purchase order before approval.',events:[['Uploaded by Minh Le','Just now','green'],['AI extraction queued','Just now','pending']]};state.docs.unshift(d);modal.remove();render();toast('Document uploaded','AI extraction simulation started. Review the new document record.');setTimeout(()=>{const x=state.docs.find(z=>z.id===id);if(x){x.status='Pending approval';x.statusKey='pending';x.hash='sha256: '+Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,6);x.events.push(['Sample extraction completed','Just now','green']);state.audit.unshift({time:new Date().toLocaleString('en-GB'),actor:'CargoTrust AI (demo)',event:'Sample extraction completed',detail:`${x.name} · Review extracted values before approval.`,result:'Success',tone:'green'});if(state.page==='documents'||state.page==='overview')render();}},1400)});}
function runAIReview(id){const d=state.docs.find(x=>x.id===id);if(!d)return;toast('Comparison started','Checking document fields against the linked purchase order.');setTimeout(()=>{if(id==='DOC-2408'){d.status='Needs review';d.statusKey='action';d.description='AI found a quantity mismatch against the approved purchase order.';toast('Exception detected','Invoice lists 240 units; PO-1182 lists 220 units.','error')}else{d.events.push(['Re-run comparison completed','Just now','green']);toast('Review completed','Sample field extraction and matching checks are complete.')}state.audit.unshift({time:new Date().toLocaleString('en-GB'),actor:'CargoTrust AI (demo)',event:'Document comparison run',detail:`${d.name} · Demo comparison completed.`,result:id==='DOC-2408'?'Exception flagged':'Success',tone:id==='DOC-2408'?'red':'green'});render()},800)}
function requestProtectedSigning(id){const d=state.docs.find(x=>x.id===id);if(!d)return;if(d.statusKey==='action'){toast('Signing blocked','Resolve document exceptions before signing.','error');return}if(state.role==='AI Agent'||state.role==='Requester'){toast('Insufficient authority','Your current demo role cannot request a protected signing operation.','error');return}const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML=`<section class="modal"><div class="modal-header"><div><h2>Protected signing request</h2><p>${esc(d.id)} · ${esc(d.name)}</p></div><button class="close-button" data-close>×</button></div><div class="modal-body"><div class="notice"><strong>✓</strong><div><strong>Policy pre-check passed (demo)</strong><br>The document has no unresolved exception in the sample workflow. The next step would be a Tide-protected signing operation in a connected environment.</div></div><div class="detail-section"><div class="match-row"><span>Document version</span><strong>v${d.statusKey==='signed'?'3':'2'}.0</strong></div><div class="match-row"><span>Fingerprint</span><strong>${esc(d.hash)}</strong></div><div class="match-row"><span>Required approvals</span><strong>2 independent approvers</strong></div><div class="match-row"><span>Tide connection</span><strong class="match-bad">Not connected</strong></div></div><div class="notice red"><strong>!</strong><div>This demo cannot create a real cryptographic signature. Confirming below only records a simulated signing request; connect TideCloak and the required Tide Fabric operation for real enforcement.</div></div></div><div class="modal-footer"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-confirm-sign>Record simulated request</button></div></section>`;$('#modal-root').append(modal);modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))modal.remove()});$('[data-confirm-sign]',modal).addEventListener('click',()=>{modal.remove();d.status='Signing requested';d.statusKey='pending';d.events.push(['Simulated signing request recorded','Just now','pending']);state.audit.unshift({time:new Date().toLocaleString('en-GB'),actor:state.role,event:'Simulated signing request',detail:`${d.id} · Tide is not connected; no cryptographic signature was produced.`,result:'Pending',tone:'green'});render();toast('Request recorded (demo)','No real signature was produced. Complete Tide integration to enable protected signing.')});}
function openTideSetup(){const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML=`<section class="modal"><div class="modal-header"><div><h2>Connect TideCloak</h2><p>Integration checklist for the CargoTrust prototype</p></div><button class="close-button" data-close>×</button></div><div class="modal-body"><div class="notice"><strong>i</strong><div>The Tide MCP server provides verified integration guidance to your coding agent. It does not automatically connect this running prototype to a TideCloak deployment.</div></div><div class="detail-section"><h4>1. Add the remote Tide MCP server</h4><div class="policy-rule" style="font-family:ui-monospace,monospace;overflow-wrap:anywhere">chatgpt mcp add tide --transport http https://mcp.tide.org/mcp</div><p style="font-size:10px;color:#8291a3;line-height:1.6">Run the command in a supported local CLI / MCP environment. For ChatGPT app settings, follow the MCP setup flow available in your client; command syntax may differ by client.</p></div><div class="detail-section"><h4>2. Set up TideCloak</h4><p style="font-size:10px;color:#8291a3;line-height:1.7">Create a TideCloak realm and OIDC client, define user roles, configure redirect URIs, then connect the app through a server-side OIDC flow. Never place client secrets in browser code.</p><a href="https://docs.tide.org/get-started/Tidecloak%20Quickstart" target="_blank" rel="noreferrer" class="link-button">Open TideCloak Quickstart ↗</a></div><div class="detail-section"><h4>3. Protect the signing action</h4><p style="font-size:10px;color:#8291a3;line-height:1.7">Identify the exact Tide-supported signing / policy API, bind the operation to the approved document version and enforce authorization on the server. Replace the prototype's simulated signing handler with the verified SDK flow.</p><a href="https://docs.tide.org/architecture" target="_blank" rel="noreferrer" class="link-button">Review Tide architecture ↗</a></div></div><div class="modal-footer"><button class="btn" data-close>Close</button><button class="btn btn-primary" data-copy-mcp>Copy MCP command</button></div></section>`;$('#modal-root').append(modal);modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))modal.remove()});$('[data-copy-mcp]',modal).addEventListener('click',async()=>{const cmd='chatgpt mcp add tide --transport http https://mcp.tide.org/mcp';try{await navigator.clipboard.writeText(cmd);toast('Command copied','Paste it into your supported MCP setup environment.')}catch{toast('MCP command',cmd)} });}
function openCounterpartyModal(){const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML=`<section class="modal"><div class="modal-header"><div><h2>Add counterparty</h2><p>Register a trading partner for document workflows.</p></div><button class="close-button" data-close>×</button></div><form id="cp-form"><div class="modal-body"><div class="form-field"><label for="cp-name">Organization name</label><input id="cp-name" required placeholder="e.g. Pacific Parts Co." /></div><div class="form-field"><label for="cp-type">Relationship</label><select id="cp-type"><option>Supplier</option><option>Buyer</option><option>Carrier</option><option>Freight forwarder</option><option>Customs broker</option></select></div><div class="form-field"><label for="cp-country">Country</label><input id="cp-country" required placeholder="e.g. Vietnam" /></div><div class="notice"><strong>i</strong><div>New counterparties are marked as unverified until an identity verification workflow is implemented.</div></div></div><div class="modal-footer"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-primary" type="submit">Add counterparty</button></div></form></section>`;$('#modal-root').append(modal);modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))modal.remove()});$('#cp-form',modal).addEventListener('submit',e=>{e.preventDefault();const name=$('#cp-name',modal).value.trim(),type=$('#cp-type',modal).value,country=$('#cp-country',modal).value.trim();state.counterparties.push({name,initials:name.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(),type,docs:0,status:'Unverified',country});modal.remove();render();toast('Counterparty added','The new partner is marked unverified.')})}
function exportData(){const rows=[['ID','Name','Type','Counterparty','Date','Value','Status'],...state.docs.map(d=>[d.id,d.name,d.type,d.counterparty,d.date,d.amount,d.status])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cargotrust-document-register.csv';a.click();URL.revokeObjectURL(url);toast('Export ready','Document register exported as CSV.')}
function bindGlobal(){ $$('.nav-item').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$('#profile-menu').addEventListener('click',()=>{if($('.role-menu')){$('.role-menu').remove();return}const menu=document.createElement('div');menu.className='role-menu';menu.innerHTML=`<button data-role="Operations Manager">Operations Manager<small>Review documents and requests</small></button><button data-role="Finance Approver">Finance Approver<small>Approve eligible requests</small></button><button data-role="Requester">Requester<small>Create requests only</small></button><button data-role="AI Agent">AI Agent<small>Extract and compare only</small></button><button data-role="Administrator">Administrator<small>Manage workspace controls</small></button>`;document.body.append(menu);$$('[data-role]',menu).forEach(b=>b.addEventListener('click',()=>{state.role=b.dataset.role;menu.remove();render();toast('Demo role changed',`Current role: ${state.role}. Role switch is for prototype testing only.`)}));setTimeout(()=>document.addEventListener('click',function closer(e){if(!menu.contains(e.target)&&e.target!==$('#profile-menu')){menu.remove();document.removeEventListener('click',closer)}},{once:true}),0)});$('#help-button').addEventListener('click',()=>toast('CargoTrust prototype','Use the left navigation to explore documents, approvals, policies and audit events.'));$('#notification-button').addEventListener('click',()=>setPage('approvals'));}
bindGlobal();render();
